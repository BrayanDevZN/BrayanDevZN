<svg xmlns="http://www.w3.org/2000/svg" width="900" height="145" viewBox="0 0 900 145" role="img" aria-labelledby="title">
  <title id="title">Embeddings, RAG, Prompt Engineering and Context Engineering</title>
  <defs>
    <linearGradient id="emb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="rag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="prompt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="context" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#EF4444"/>
    </linearGradient>
  </defs>

  <!-- Embeddings -->
  <g transform="translate(70 8)">
    <circle cx="45" cy="46" r="38" fill="none" stroke="url(#emb)" stroke-width="3" opacity=".35"/>
    <path d="M25 60 34 32M41 29 75 21M81 28l9 31M84 65 51 78M43 75 26 63M39 35l9 37" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="22" cy="65" r="8" fill="#2DD4BF"/>
    <circle cx="38" cy="28" r="8" fill="#22D3EE"/>
    <circle cx="79" cy="19" r="8" fill="#60A5FA"/>
    <circle cx="92" cy="64" r="8" fill="#A78BFA"/>
    <circle cx="48" cy="80" r="8" fill="#38BDF8"/>
  </g>
  <text x="115" y="128" text-anchor="middle" fill="#8B949E" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="700">Embeddings</text>

  <!-- RAG -->
  <g transform="translate(285 9)">
    <rect x="5" y="10" width="58" height="74" rx="11" fill="none" stroke="url(#rag)" stroke-width="5"/>
    <path d="M19 31h29M19 45h29M19 59h19" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="75" cy="63" r="23" fill="none" stroke="#60A5FA" stroke-width="6"/>
    <path d="M91 80l17 17" stroke="#A78BFA" stroke-width="8" stroke-linecap="round"/>
    <path d="M66 63h18" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="340" y="128" text-anchor="middle" fill="#8B949E" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="700">RAG</text>

  <!-- Prompt Engineering -->
  <g transform="translate(505 12)">
    <path d="M3 16h91v57H48L27 91V73H3Z" fill="none" stroke="url(#prompt)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M20 35h51M20 50h36" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="81" cy="61" r="14" fill="#FACC15"/>
    <path d="m81 51 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1Z" fill="#FFF7CC"/>
  </g>
  <text x="555" y="128" text-anchor="middle" fill="#8B949E" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="700">Prompt Engineering</text>

  <!-- Context Engineering -->
  <g transform="translate(730 10)">
    <rect x="0" y="23" width="40" height="55" rx="9" fill="none" stroke="#F59E0B" stroke-width="5"/>
    <rect x="29" y="9" width="40" height="55" rx="9" fill="none" stroke="#F97316" stroke-width="5"/>
    <rect x="58" y="28" width="40" height="55" rx="9" fill="none" stroke="#EF4444" stroke-width="5"/>
    <path d="M11 43h17M40 28h17M69 47h17M40 43h17M69 62h17" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="780" y="128" text-anchor="middle" fill="#8B949E" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="700">Context Engineering</text>
</svg>