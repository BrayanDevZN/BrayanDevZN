<svg xmlns="http://www.w3.org/2000/svg" width="760" height="145" viewBox="0 0 760 145" role="img" aria-labelledby="title">
  <title id="title">Clean Architecture, Event-Driven and Monolithic Architecture</title>
  <defs>
    <linearGradient id="clean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="event" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="mono" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Clean Architecture -->
  <g transform="translate(85 7)">
    <circle cx="45" cy="48" r="43" fill="none" stroke="url(#clean)" stroke-width="4" stroke-dasharray="5 7"/>
    <circle cx="45" cy="48" r="31" fill="none" stroke="#60A5FA" stroke-width="6"/>
    <circle cx="45" cy="48" r="18" fill="none" stroke="#818CF8" stroke-width="6"/>
    <circle cx="45" cy="48" r="7" fill="#E0F2FE"/>
  </g>
  <text x="130" y="128" text-anchor="middle" fill="#8B949E" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="700">Clean Architecture</text>

  <!-- Event Driven -->
  <g transform="translate(335 9)">
    <circle cx="45" cy="15" r="9" fill="#22D3EE" stroke="#E0F2FE" stroke-width="2"/>
    <circle cx="83" cy="48" r="9" fill="#3B82F6" stroke="#E0F2FE" stroke-width="2"/>
    <circle cx="45" cy="81" r="9" fill="#8B5CF6" stroke="#E0F2FE" stroke-width="2"/>
    <circle cx="7" cy="48" r="9" fill="#6366F1" stroke="#E0F2FE" stroke-width="2"/>
    <circle cx="45" cy="48" r="24" fill="none" stroke="url(#event)" stroke-width="5"/>
    <path d="M45 27a21 21 0 0 1 21 21M66 48l-8-8M66 48l-8 8M45 69a21 21 0 0 1-21-21M24 48l8-8M24 48l8 8" fill="none" stroke="url(#event)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m50 38-11 16h8l-3 12 14-20h-9Z" fill="#FACC15" stroke="#FFF7CC" stroke-width="2"/>
  </g>
  <text x="380" y="128" text-anchor="middle" fill="#8B949E" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="700">Event-Driven</text>

  <!-- Monolithic -->
  <g transform="translate(590 9)">
    <rect x="5" y="5" width="80" height="86" rx="17" fill="none" stroke="url(#mono)" stroke-width="6"/>
    <rect x="20" y="20" width="50" height="16" rx="5" fill="#22D3EE"/>
    <rect x="20" y="42" width="50" height="16" rx="5" fill="#60A5FA"/>
    <rect x="20" y="64" width="50" height="16" rx="5" fill="#A78BFA"/>
    <path d="M29 28h32M29 50h32M29 72h32" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="635" y="128" text-anchor="middle" fill="#8B949E" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="700">Monolithic</text>
</svg>